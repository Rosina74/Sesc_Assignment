<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        /* Body background and center alignment */
        body {
            margin: 0;
            padding: 0;
            background-color: #e6dcf5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        /* Heading styling */
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }

        /* Login form styling */
        #login {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 360px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Hide labels for minimalist design */
        #login label {
            display: none;
        }

        /* Input fields */
        #login input[type="email"],
        #login input[type="password"],
        #login input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Submit button styling */
        #login input[type="submit"] {
            background: linear-gradient(to right, #7b2ff7, #f107a3);
            color: white;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        #login input[type="submit"]:hover {
            background: linear-gradient(to right, #6829cc, #d00692);
        }

    </style>
</head>
<body>
<h2>Login Form</h2>
<form id="login" method="post">
<!--    <label for="email">Email:</label>-->
<!--    <input type="email" id="email" name="email" required><br><br>-->

<!--    <label for="password">Password:</label>-->
<!--    <input type="password" id="password" name="password" required><br><br>-->
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>


    <input type="submit" value="Login">
</form>

<script>
    document.getElementById('login').addEventListener('submit', function (event){
        event.preventDefault()

        const email = document.getElementById('email').value
        const password = document.getElementById('password').value
        fetch(`http://localhost:8080/student/${email}?password=${password}`,{
            method:'POST',
            header: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => {
                console.log(response)
                if(response.ok){
                    alert("log in successful")
                    sessionStorage.clear()
                    sessionStorage.setItem("email", email);
                    window.location.href = "studentPage.html";
                }
                else {
                    alert('log in failed, because of incorrect password')
                }
            })
    })


</script>

</body>
</html>
