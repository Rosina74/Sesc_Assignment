<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrolled Courses</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: deepskyblue;
        }
        input, button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .navbar {
            background-color: mediumpurple;
            overflow: hidden;
            text-align: center;
        }

        .navbar a {
            display: inline-block;
            padding: 14px 20px;
            text-decoration: none;
            color: white;
            font-size: 18px;
        }

        .navbar a:hover {
            background-color: hotpink;
            color: black;
        }
    </style>
</head>
<body>
<div class="navbar">
    <a href="EnrolCourse.html">Enrol Course</a>
    <a href="studentPage.html">Student Page</a>
    <a href="ViewEnrolment.html">View Enrolment</a>
    <a href="ViewStudentProfile.html">View Student Profile</a>
    <a href="Graduation.html">Graduation</a>

</div>

<h2>View Enrolled Courses</h2>
<form id="studentForm">
    <label for="studentId">Enter Student ID:</label>
    <input type="text" id="studentId" required>

    <label for="studentId">Enter Student Email</label>
    <input type="emal" id="email" required>
    <button type="submit">View Courses</button>
</form>

<table id="courseTable" style="display:none;">
    <thead>
    <tr>
        <th>Course ID</th>
        <th>Course Title</th>
        <th>Instructor</th>
    </tr>
    </thead>
    <tbody id="courseBody"></tbody>
</table>

<script>
    document.getElementById("studentForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const studentId = document.getElementById("studentId").value;
        const email = document.getElementById("email").value;

        try {
            const response = await fetch(`http://localhost:8080/courses/viewEnrolledCourse/${studentId}/${email}`); // Replace with actual API URL
            const courses = await response.json();

            if (response.ok && courses.length > 0) {
                displayCourses(courses);
            } else {
                alert("No enrolled courses found.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred while fetching courses.");
        }
    });

    function displayCourses(courses) {
        const table = document.getElementById("courseTable");
        const tableBody = document.getElementById("courseBody");

        tableBody.innerHTML = ""; // Clear previous results

        courses.forEach(course => {
            let row = document.createElement("tr");
            row.innerHTML = `<td>${course.id}</td><td>${course.title}</td><td>${course.description}</td>`;
            tableBody.appendChild(row);
        });

        table.style.display = "block"; // Show table
    }
</script>

</body>
</html>
