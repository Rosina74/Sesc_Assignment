<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>
<h2>Student Registration Form</h2>
<form id="register">
    <label for="externalStudentId">Student ID:</label>
    <input type="text" id="externalStudentId" name="externalStudentId"><br><br>

    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName" required><br><br>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName" required><br><br>

    <label for="phoneNumber">Phone Number:</label>
    <input type="tel" id="phoneNumber" name="phoneNumber" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Password</label>
    <input type="text" id="password" name="password" required><br><br>

    <label for="dateOfBirth">Date of Birth:</label>
    <input type="date" id="dateOfBirth" name="dateOfBirth" required><br><br>

    <input type="submit" value="Register">

</form>
<br>
<button onclick=login()>Login</button><br><br>

<script>
    document.getElementById("register").addEventListener('submit', function (event){
        event.preventDefault()


        const studentData = {
            externalStudentId: document.getElementById("externalStudentId").value,
            firstName: document.getElementById("firstName").value,
            lastName: document.getElementById("lastName").value,
            email: document.getElementById("email").value,
            password: document.getElementById('password').value,
            phoneNumber: document.getElementById("phoneNumber").value,
            dateOfBirth: document.getElementById("dateOfBirth").value,

        };
        console.log(studentData)

        fetch("http://localhost:8080/student/create", {
            method: "POST", // Use POST to send data
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(studentData)
        })
            .then(response=>{
                if (response.ok){
                    alert("successful")
                    sessionStorage.clear()
                    sessionStorage.setItem("studentId", studentData.externalStudentId)
                    //send studentidto profile
                }
            })
    })
    function login(){
        window.location.href='Login.html'
    }


</script>
</body>
</html>
