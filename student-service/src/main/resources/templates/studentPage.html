<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <style>

        #enroll{
            width: 200px;
            height: 100px;
            background-color: deepskyblue;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #3383c1;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Courses</h2>
<table id="dataTable">
    <thead>
    <tr id="tableHead"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>
<br>
<button id="enroll" onclick="enrollCourse()">Enroll</button>

<script>
    function enrollCourse(){
        window.location.href = "EnrolCourse.html"
    }
    async function fetchData() {
        try {
            // Replace with your actual API URL
            const response = await fetch('http://localhost:8082/courses',{
            });
            const data = await response.json();

            // Populate table with JSON data
            createTable(data);
        } catch (error) {
            console.error("Error fetching data: ", error);
        }
    }


    function createTable(data) {
        const tableHead = document.getElementById("tableHead");
        const tableBody = document.getElementById("tableBody");

        // Create table headers dynamically
        const headers = Object.keys(data[0]);
        headers.forEach(header => {
            let th = document.createElement("th");
            th.textContent = header;
            tableHead.appendChild(th);
        });

        // Create table rows dynamically
        data.forEach(item => {
            let row = document.createElement("tr");
            headers.forEach(header => {
                let td = document.createElement("td");
                td.textContent = item[header];
                row.appendChild(td);
            });
            tableBody.appendChild(row);
        });
    }

    fetchData(); // Call function to fetch and display data
</script>

</body>
</html>
