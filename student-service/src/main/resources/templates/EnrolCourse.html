<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Enrollment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    form {
      width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
    .navbar {
      background-color: mediumpurple;
      overflow: hidden;
      text-align: center;
    }

    .navbar a {
      display: inline-block;
      padding: 14px 20px;
      text-decoration: none;
      color: white;
      font-size: 18px;
    }

    .navbar a:hover {
      background-color: hotpink;
      color: black;
    }
  </style>
</head>
<body>
<div class="navbar">
  <a href="EnrolCourse.html">Enrol Course</a>
  <a href="studentPage.html">Student Page</a>
  <a href="ViewEnrolment.html">View Enrolment</a>
  <a href="ViewStudentProfile.html">View Student Profile</a>
  <a href="Graduation.html">Graduation</a>

</div>

<h2>Enroll a Student</h2>
<form id="enrollmentForm">
  <label for="studentId">Student ID:</label>
  <input type="text" id="studentId" required>

  <label for="courseId">Course ID:</label>
  <input type="text" id="courseId" required>

  <label for="email">your Email:</label>
  <input type="email" id="email" required placeholder="Please enter your email">

  <button type="submit" value="enroll">Enroll</button> <br>

</form>

<script>
  const status = sessionStorage.getItem("status")
  console.log(sessionStorage.getItem("status"))
  document.getElementById("enrollmentForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const studentId = document.getElementById("studentId").value;
    const courseId = document.getElementById("courseId").value;
    const email = document.getElementById("email").value;

    const enrollmentData = {
      studentId,
      courseId,
      email
    };
    if (status === null || status === "PAID") {
      fetch(`http://localhost:8080/courses/enroll/course/${courseId}/student/${studentId}/email${email}`, { // Replace with actual API URL
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        }
      })
              .then(response => response.json())
              .then(data => {
                console.log(data)
                alert("Student enrolled succefully")
                console.log(data.reference)
                sessionStorage.setItem("reference", data.reference)
                sessionStorage.removeItem("status")
                sessionStorage.setItem("status", data.status)
                location.reload()
              });
    }
    else{
      alert("you have an outstanding balance , please pay to enroll a new course")
    }
  })


</script>

</body>
</html>
